<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ .Site.Title }}</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #d4d4d4;
            font-family: monospace;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        h2 {
            color: #ffffff;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .post {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <h1>{{ .Site.Title }}</h1>
    <hr style="border: 0; border-top: 1px solid #333; margin-bottom: 30px;">

    {{ range where .Site.RegularPages "Section" "posts" }}
        <div class="post">
            <h2>{{ .Title }}</h2>
            <div>{{ .Content }}</div>
        </div>
    {{ else }}
        <p style="color: #888;">[ SYSTEM ERROR: NO RECORDS FOUND IN CONTENT/POSTS ]</p>
    {{ end }}

</body>
</html>s
